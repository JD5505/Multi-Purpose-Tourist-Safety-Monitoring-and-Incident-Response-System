[project]
name = "anomalydetector"
version = "0.1.1"
description = "A Tourist Safety Monitoring System is a software that monitors user's live location and handles trajectory anomalies using machine learning."
readme = "README.md"
authors = [
    { name = "Jivan Divate", email = "divatejivan2005@gmail.com" },
    { name = "Yashashree Chakane", email = "" },
    { name = "Jayshree Gaikwad", email = "" }
]

requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "joblib==1.6",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg[pool]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "web3>=8.0.0",
]

[project.scripts]
anomalydetector = "anomalydetector:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
